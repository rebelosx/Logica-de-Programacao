<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula - Javascript</title>
    <script>
        var nome = prompt("Digite seu nome: ");
        nome = true;
        document.write( nome );

        var n1 = prompt("Digite um número: ");
        var n2 = prompt("Digite outro número: ");

        n1 = eval(n1);
        n2 = eval(n2);

        var res = n1 + n2;
        document.write( res );
    </script>
</head>

</body>
</html>
