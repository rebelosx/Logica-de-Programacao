<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 2 - Tabelas</title>
    <style>
        h1 {
            color: yellow;
            font-size: 50px;
        }
        body {
            background-color: black;
            margin: 0;
            height: 100vh;
        }
        table {
            border-collapse: collapse;
            width: 100%;
        }
        th, td {
            border: 5px solid white;
            background-color: grey;
            padding: 8px;
            text-align: left;
        }
        caption {
            border: 5px solid white;
            background-color: yellow;
            font-size: 30px;
            padding: 8px;
            font-weight: bold;
        }
        footer {
            color: red;
        }
    </style>
</head>
<body>
    <h1> Aulas Tabelas - 2</h1>
    
    <table>
        <caption> Informações da Tabelas</caption>
        
        <tr>
            <th style="background-color: #8ff3cd;"> Codigo </th>
            <th style="background-color: #7e2fc7;"> Nome </th>
            <th style="background-color: brown;"> Idade</th>
        </tr>
        <tr>
            <td> 231282026 </td>
            <td> Arthur </td>
            <td> 18 </td>

        </tr>

    </table>
    <footer>
        <p color: red;>&copy; os direitos reservados a </p>
    </footer>
    
</body>
</html>
